<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Tech Academy - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 min-h-screen">
    <!-- Sidebar / Nav -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2 text-indigo-600 font-extrabold text-2xl tracking-tighter">
            <span class="bg-indigo-600 text-white px-2 py-1 rounded-lg">HI</span>
            <span>TECH</span>
            <span class="text-slate-400 text-sm font-bold ml-2 uppercase tracking-widest">ADMIN</span>
        </div>
        <div class="flex items-center gap-4 relative">
            <div class="text-right hidden md:block">
                <div id="user-email" class="text-slate-900 font-bold text-sm"></div>
                <div id="user-role" class="text-slate-500 font-medium text-xs uppercase tracking-widest"></div>
            </div>
            <div class="relative group cursor-pointer">
                <div id="profile-icon" class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-lg uppercase"></div>
                <div class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-slate-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50">
                    <div class="p-2">
                        <a href="./profile.html" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 rounded-lg font-medium">Profile</a>
                        <button onclick="window.logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg font-bold">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid lg:grid-cols-3 gap-8">
        <!-- Upload Form -->
        <div class="lg:col-span-1 space-y-8">
            <div class="bg-white/80 backdrop-blur-xl p-8 rounded-[2.5rem] shadow-[0_20px_50px_rgba(99,102,241,0.05)] border border-white/20">
                <h2 class="text-2xl font-black text-slate-900 tracking-tighter mb-6 uppercase">UPLOAD CONTENT</h2>
                <form id="upload-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-widest">Title</label>
                        <input type="text" id="title" required class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium" placeholder="Lesson Title">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-widest">Type</label>
                        <select id="type" required class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium appearance-none">
                            <option value="pdf">PDF (Book)</option>
                            <option value="video">Video</option>
                            <option value="image">Image</option>
                            <option value="text">Announcement</option>
                            <option value="question">Question</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-widest">Audience</label>
                        <select id="audience" required class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium appearance-none">
                            <option value="all">All</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    <div id="file-input-container">
                        <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-widest">File Upload</label>
                        <input type="file" id="file_upload" class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium">
                    </div>
                    <div id="content-input-container" class="hidden">
                        <label class="block text-sm font-bold text-slate-700 mb-2 uppercase tracking-widest">Content</label>
                        <textarea id="content" rows="4" class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium" placeholder="Enter announcement content..."></textarea>
                    </div>
                    <button type="submit" id="upload-btn" class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black text-lg hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100">
                        UPLOAD
                    </button>
                </form>
                <div id="upload-status" class="mt-4 text-sm font-bold text-center hidden"></div>
            </div>
        </div>

        <!-- Content Lists -->
        <div class="lg:col-span-2 space-y-8">
            <!-- Posts List -->
            <div class="bg-white/80 backdrop-blur-xl p-8 rounded-[2.5rem] shadow-[0_20px_50px_rgba(99,102,241,0.05)] border border-white/20">
                <h2 class="text-2xl font-black text-slate-900 tracking-tighter mb-6 uppercase">UPLOADED CONTENT</h2>
                <div id="posts-list" class="space-y-4">
                    <p class="text-slate-400 font-medium text-center py-10">Loading content...</p>
                </div>
            </div>

            <!-- Users List -->
            <div class="bg-white/80 backdrop-blur-xl p-8 rounded-[2.5rem] shadow-[0_20px_50px_rgba(99,102,241,0.05)] border border-white/20">
                <h2 class="text-2xl font-black text-slate-900 tracking-tighter mb-6 uppercase">USERS LIST</h2>
                <div id="users-list" class="space-y-4">
                    <p class="text-slate-400 font-medium text-center py-10">Loading users...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js" type="module"></script>
    <script src="./js/auth.js" type="module"></script>
    <script type="module">
        document.addEventListener('DOMContentLoaded', async () => {
            const authData = await window.checkAuth('admin');
            if (!authData) return;
            document.getElementById('user-email').innerText = authData.user.email;

            fetchPosts();
            fetchUsers();
        });

        async function fetchPosts() {
            try {
                const { data, error } = await window.supabaseClient
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const list = document.getElementById('posts-list');
                if (data.length === 0) {
                    list.innerHTML = `<p class="text-slate-400 font-medium text-center py-10">No content uploaded yet.</p>`;
                    return;
                }

                list.innerHTML = data.map(post => `
                    <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-900 uppercase tracking-tighter">${post.title}</p>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">${post.type} • For: ${post.audience}</p>
                            ${post.type === 'text' ? `<p class="text-sm text-slate-600 mt-2 line-clamp-2">${post.content || ''}</p>` : ''}
                        </div>
                        <div class="flex gap-2">
                            ${post.file_url ? `<a href="${post.file_url}" target="_blank" class="text-indigo-600 font-bold text-xs hover:underline">VIEW</a>` : ''}
                            <button onclick="deletePost('${post.id}')" class="text-red-500 font-bold text-xs hover:underline">DELETE</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('posts-list').innerHTML = `<p class="text-red-500 font-bold text-center py-10">${err.message}</p>`;
            }
        }

        async function fetchUsers() {
            try {
                const { data, error } = await window.supabaseClient
                    .from('users')
                    .select('*');

                if (error) throw error;

                const list = document.getElementById('users-list');
                if (data.length === 0) {
                    list.innerHTML = `<p class="text-slate-400 font-medium text-center py-10">No users found.</p>`;
                    return;
                }

                list.innerHTML = data.map(user => `
                    <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-900">${user.email}</p>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Role: ${user.role}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('users-list').innerHTML = `<p class="text-red-500 font-bold text-center py-10">${err.message}</p>`;
            }
        }

        window.deletePost = async function(id) {
            if (!window.supabaseClient || !window.supabaseClient.auth) {
                console.error("Supabase not loaded correctly");
                alert("The authentication service is currently unavailable. Please refresh the page.");
                return;
            }
            if (!confirm('Are you sure you want to delete this content?')) return;
            try {
                const { error } = await window.supabaseClient
                    .from('posts')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                fetchPosts();
            } catch (err) {
                alert(err.message);
            }
        }

        document.getElementById('type').addEventListener('change', (e) => {
            const type = e.target.value;
            const fileContainer = document.getElementById('file-input-container');
            const contentContainer = document.getElementById('content-input-container');
            const fileInput = document.getElementById('file_upload');
            const contentInput = document.getElementById('content');

            if (type === 'text') {
                fileContainer.classList.add('hidden');
                contentContainer.classList.remove('hidden');
                fileInput.removeAttribute('required');
                contentInput.setAttribute('required', 'true');
            } else {
                fileContainer.classList.remove('hidden');
                contentContainer.classList.add('hidden');
                fileInput.setAttribute('required', 'true');
                contentInput.removeAttribute('required');
            }
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Safe fallback check
            if (!window.supabaseClient || !window.supabaseClient.auth) {
                console.error("Supabase not loaded correctly");
                alert("The authentication service is currently unavailable. Please refresh the page.");
                return;
            }

            const title = document.getElementById('title').value;
            const type = document.getElementById('type').value;
            const audience = document.getElementById('audience').value;
            const content = document.getElementById('content').value;
            const fileInput = document.getElementById('file_upload');
            const file = fileInput.files[0];
            const btn = document.getElementById('upload-btn');
            const status = document.getElementById('upload-status');

            btn.disabled = true;
            btn.innerText = 'UPLOADING...';
            status.classList.remove('hidden');
            status.innerText = 'Processing...';

            try {
                let file_url = null;
                if (file && type !== 'text') {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random()}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { error: uploadError } = await window.supabaseClient.storage
                        .from('files')
                        .upload(filePath, file);

                    if (uploadError) throw uploadError;

                    const { data: { publicUrl } } = window.supabaseClient.storage
                        .from('files')
                        .getPublicUrl(filePath);
                        
                    file_url = publicUrl;
                }

                const postData = { title, type, audience };
                if (type === 'text') {
                    postData.content = content;
                } else {
                    postData.file_url = file_url;
                }

                const { error } = await window.supabaseClient
                    .from('posts')
                    .insert([postData]);

                if (error) throw error;

                status.innerText = 'Upload successful!';
                status.classList.add('text-green-500');
                document.getElementById('upload-form').reset();
                fetchPosts();
            } catch (err) {
                status.innerText = err.message;
                status.classList.add('text-red-500');
            } finally {
                btn.disabled = false;
                btn.innerText = 'UPLOAD';
                setTimeout(() => {
                    status.classList.add('hidden');
                    status.classList.remove('text-green-500', 'text-red-500');
                }, 3000);
            }
        });
    </script>
</body>
</html>
